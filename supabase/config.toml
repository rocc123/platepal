# Used by `supabase link`, `db push`, and `functions deploy`.
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "plate-pal"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://127.0.0.1:4521"
additional_redirect_urls = ["http://127.0.0.1:4521"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[functions.analyze]
verify_jwt = true
